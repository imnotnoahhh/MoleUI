name: Auto Update Mole CLI

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  check-and-update:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get current Mole version
        id: current_version
        run: |
          if [ -f .mole-cli-version ]; then
            VERSION=$(cat .mole-cli-version)
          else
            VERSION="none"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Get latest Mole release
        id: latest_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh api repos/tw93/Mole/releases/latest --jq '.tag_name')
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "Failed to fetch latest release tag"
            exit 1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          # Strip v/V prefix for version comparison
          VERSION="${TAG#v}"
          VERSION="${VERSION#V}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if update needed
        id: check_update
        run: |
          CURRENT="${{ steps.current_version.outputs.version }}"
          LATEST="${{ steps.latest_release.outputs.version }}"
          echo "Current: $CURRENT, Latest: $LATEST"
          if [ "$CURRENT" != "$LATEST" ]; then
            echo "update_needed=true" >> $GITHUB_OUTPUT
          else
            echo "update_needed=false" >> $GITHUB_OUTPUT
          fi

      - name: Download latest Mole source
        if: steps.check_update.outputs.update_needed == 'true'
        run: |
          TAG="${{ steps.latest_release.outputs.tag }}"
          curl -fsSL "https://github.com/tw93/Mole/archive/refs/tags/${TAG}.tar.gz" -o /tmp/mole-source.tar.gz
          mkdir -p /tmp/mole-source
          tar -xzf /tmp/mole-source.tar.gz -C /tmp/mole-source --strip-components=1
          rm -rf Resources/mole
          cp -R /tmp/mole-source Resources/mole

      - name: Setup Go
        if: steps.check_update.outputs.update_needed == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: Resources/mole/go.mod

      - name: Build Go binaries
        if: steps.check_update.outputs.update_needed == 'true'
        working-directory: Resources/mole
        run: |
          make release-amd64
          make release-arm64
          lipo -create -output bin/status-go bin/status-darwin-amd64 bin/status-darwin-arm64
          lipo -create -output bin/analyze-go bin/analyze-darwin-amd64 bin/analyze-darwin-arm64
          rm -f bin/*-darwin-amd64 bin/*-darwin-arm64
          file bin/status-go bin/analyze-go

      - name: Compatibility check
        if: steps.check_update.outputs.update_needed == 'true'
        id: compat
        run: |
          ERRORS=""
          SMOKE_HOME="/tmp/mole-smoke-home"

          for f in \
            Resources/mole/mole \
            Resources/mole/bin/status-go \
            Resources/mole/bin/analyze-go \
            Resources/mole/bin/clean.sh \
            Resources/mole/bin/optimize.sh \
            Resources/mole/bin/purge.sh \
            Resources/mole/bin/installer.sh \
            Resources/mole/bin/uninstall.sh \
            Resources/mole/lib/check/health_json.sh; do
            if [ ! -f "$f" ]; then
              ERRORS="$ERRORS\n- Missing file: $f"
            fi
          done

          for d in \
            Resources/mole/lib/core \
            Resources/mole/lib/clean \
            Resources/mole/lib/optimize \
            Resources/mole/lib/uninstall; do
            if [ ! -d "$d" ]; then
              ERRORS="$ERRORS\n- Missing directory: $d"
            fi
          done

          for bin in Resources/mole/bin/status-go Resources/mole/bin/analyze-go; do
            if [ ! -x "$bin" ]; then
              ERRORS="$ERRORS\n- Binary not executable: $bin"
            fi
            if ! file "$bin" | grep -q "Mach-O"; then
              ERRORS="$ERRORS\n- Invalid binary (not Mach-O): $bin"
            fi
          done

          for script in \
            Resources/mole/bin/clean.sh \
            Resources/mole/bin/optimize.sh \
            Resources/mole/bin/purge.sh \
            Resources/mole/bin/installer.sh \
            Resources/mole/bin/uninstall.sh; do
            if [ -f "$script" ] && [ ! -x "$script" ]; then
              ERRORS="$ERRORS\n- Script not executable: $script"
            fi
          done

          if [ -z "$ERRORS" ]; then
            if ! bash Resources/mole/mole version > /tmp/mole-version.txt 2>/tmp/mole-version.err; then
              ERRORS="$ERRORS\n- 'mole version' failed"
            fi
          fi

          if [ -z "$ERRORS" ]; then
            if ! bash Resources/mole/mole status --json > /tmp/mole-status.json 2>/tmp/mole-status.err; then
              ERRORS="$ERRORS\n- 'mole status --json' failed"
            elif ! python3 -c 'import json; json.load(open("/tmp/mole-status.json"))' 2>/tmp/mole-status-parse.err; then
              ERRORS="$ERRORS\n- 'mole status --json' returned invalid JSON"
            fi
          fi

          if [ -z "$ERRORS" ]; then
            rm -rf "$SMOKE_HOME"
            mkdir -p \
              "$SMOKE_HOME/Desktop" \
              "$SMOKE_HOME/Documents" \
              "$SMOKE_HOME/Downloads" \
              "$SMOKE_HOME/Projects/demo/node_modules" \
              "$SMOKE_HOME/.config/mole"
            printf '{}' > "$SMOKE_HOME/Projects/demo/package.json"
            : > "$SMOKE_HOME/Downloads/sample-installer.dmg"
            printf '%s\n' "$SMOKE_HOME/Projects" > "$SMOKE_HOME/.config/mole/purge_paths"
          fi

          if [ -z "$ERRORS" ]; then
            if ! bash Resources/mole/mole analyze --json "$SMOKE_HOME" > /tmp/mole-analyze.json 2>/tmp/mole-analyze.err; then
              ERRORS="$ERRORS\n- 'mole analyze --json \$SMOKE_HOME' failed"
            elif ! python3 -c 'import json; json.load(open("/tmp/mole-analyze.json"))' 2>/tmp/mole-analyze-parse.err; then
              ERRORS="$ERRORS\n- 'mole analyze --json \$SMOKE_HOME' returned invalid JSON"
            fi
          fi

          if [ -z "$ERRORS" ]; then
            if ! env HOME="$SMOKE_HOME" TERM=dumb MOLE_TEST_MODE=1 bash Resources/mole/lib/check/health_json.sh > /tmp/mole-health.json 2>/tmp/mole-health.err; then
              ERRORS="$ERRORS\n- 'lib/check/health_json.sh' failed"
            elif ! python3 -c 'import json; json.load(open("/tmp/mole-health.json"))' 2>/tmp/mole-health-parse.err; then
              ERRORS="$ERRORS\n- 'lib/check/health_json.sh' returned invalid JSON"
            fi
          fi

          if [ -z "$ERRORS" ]; then
            if ! env HOME="$SMOKE_HOME" TERM=dumb MOLE_TEST_MODE=1 MOLE_DRY_RUN=1 DRY_RUN=true bash Resources/mole/mole clean --dry-run > /tmp/mole-clean-dry-run.txt 2>/tmp/mole-clean-dry-run.err; then
              ERRORS="$ERRORS\n- 'mole clean --dry-run' failed"
            fi
          fi

          if [ -z "$ERRORS" ]; then
            if ! env HOME="$SMOKE_HOME" TERM=dumb MOLE_TEST_MODE=1 bash Resources/mole/mole optimize --dry-run > /tmp/mole-optimize-dry-run.txt 2>/tmp/mole-optimize-dry-run.err; then
              ERRORS="$ERRORS\n- 'mole optimize --dry-run' failed"
            fi
          fi

          if [ -z "$ERRORS" ]; then
            if ! env HOME="$SMOKE_HOME" TERM=dumb MOLE_TEST_MODE=1 bash Resources/mole/mole purge --dry-run > /tmp/mole-purge-dry-run.txt 2>/tmp/mole-purge-dry-run.err; then
              ERRORS="$ERRORS\n- 'mole purge --dry-run' failed"
            fi
          fi

          if [ -z "$ERRORS" ]; then
            if ! env HOME="$SMOKE_HOME" TERM=dumb MOLE_TEST_MODE=1 bash Resources/mole/mole installer --dry-run > /tmp/mole-installer-dry-run.txt 2>/tmp/mole-installer-dry-run.err; then
              ERRORS="$ERRORS\n- 'mole installer --dry-run' failed"
            fi
          fi

          if [ -z "$ERRORS" ]; then
            if ! env HOME="$SMOKE_HOME" TERM=dumb MOLE_TEST_MODE=1 bash Resources/mole/mole uninstall --dry-run > /tmp/mole-uninstall-dry-run.txt 2>/tmp/mole-uninstall-dry-run.err; then
              ERRORS="$ERRORS\n- 'mole uninstall --dry-run' failed"
            fi
          fi

          if [ -z "$ERRORS" ]; then
            echo "compatible=true" >> $GITHUB_OUTPUT
          else
            echo "compatible=false" >> $GITHUB_OUTPUT
            echo "errors<<EOF" >> $GITHUB_OUTPUT
            echo -e "$ERRORS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Update MoleUI version
        if: steps.check_update.outputs.update_needed == 'true' && steps.compat.outputs.compatible == 'true'
        id: version_update
        run: |
          VERSION="${{ steps.latest_release.outputs.version }}"
          echo "$VERSION" > .mole-cli-version
          echo "$VERSION" > MoleUI/.mole-cli-version

          CURRENT_VERSION=$(grep "MARKETING_VERSION = " MoleUI.xcodeproj/project.pbxproj | head -1 | sed 's/.*MARKETING_VERSION = \(.*\);/\1/')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          NEW_MOLEUI_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          sed -i '' "s/MARKETING_VERSION = [^;]*/MARKETING_VERSION = $NEW_MOLEUI_VERSION/" MoleUI.xcodeproj/project.pbxproj
          echo "Updated MoleUI version: $CURRENT_VERSION → $NEW_MOLEUI_VERSION"
          echo "moleui_version=$NEW_MOLEUI_VERSION" >> $GITHUB_OUTPUT

      - name: Create PR (compatible)
        if: steps.check_update.outputs.update_needed == 'true' && steps.compat.outputs.compatible == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update Mole CLI to ${{ steps.latest_release.outputs.version }}"
          branch: auto-update-mole-${{ steps.latest_release.outputs.version }}
          delete-branch: true
          title: "Update Mole CLI to ${{ steps.latest_release.outputs.version }} (MoleUI ${{ steps.version_update.outputs.moleui_version }})"
          body: |
            Automated Mole CLI update with compatibility verification.

            **Version Changes:**
            - MoleUI: ${{ steps.version_update.outputs.moleui_version }}
            - Bundled Mole CLI: ${{ steps.current_version.outputs.version }} → ${{ steps.latest_release.outputs.version }}

            **Compatibility Checks:**
            - ✅ All required files and directories present
            - ✅ Go binaries are valid universal Mach-O executables
            - ✅ Shell scripts are executable
            - ✅ JSON smoke checks pass for status, analyze, and health report generation
            - ✅ Dry-run smoke checks pass for clean, optimize, purge, installer, and uninstall

            **Upstream Release Notes:**
            https://github.com/tw93/Mole/releases/tag/${{ steps.latest_release.outputs.tag }}
          labels: dependencies,automated

      - name: Create Issue (breaking)
        if: steps.check_update.outputs.update_needed == 'true' && steps.compat.outputs.compatible == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Breaking: Mole CLI ${{ steps.latest_release.outputs.version }} has incompatible changes`,
              body: `Mole CLI ${{ steps.latest_release.outputs.version }} failed compatibility checks:\n${{ steps.compat.outputs.errors }}\n\nRelease notes: https://github.com/tw93/Mole/releases/tag/${{ steps.latest_release.outputs.tag }}\n\nManual adaptation required.`,
              labels: ['breaking-change', 'mole-update']
            });
