name: Auto Update Mole CLI

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  check-and-update:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get current Mole version
        id: current_version
        run: |
          if [ -f .mole-cli-version ]; then
            VERSION=$(cat .mole-cli-version)
          else
            VERSION="none"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Get latest Mole release
        id: latest_release
        run: |
          LATEST=$(curl -s https://api.github.com/repos/tw93/Mole/releases/latest | jq -r '.tag_name')
          echo "version=$LATEST" >> $GITHUB_OUTPUT

      - name: Check if update needed
        id: check_update
        run: |
          if [ "${{ steps.current_version.outputs.version }}" != "${{ steps.latest_release.outputs.version }}" ]; then
            echo "update_needed=true" >> $GITHUB_OUTPUT
          else
            echo "update_needed=false" >> $GITHUB_OUTPUT
          fi

      - name: Install latest Mole
        if: steps.check_update.outputs.update_needed == 'true'
        run: |
          brew update
          brew upgrade mole || brew install mole

      - name: Extract Mole CLI files
        if: steps.check_update.outputs.update_needed == 'true'
        run: |
          rm -rf Resources/mole/*
          MOLE_PATH=$(which mole)
          MOLE_REAL=$(readlink "$MOLE_PATH")
          MOLE_ROOT=$(dirname $(dirname "$MOLE_REAL"))
          mkdir -p Resources/mole
          cp -R "$MOLE_ROOT/libexec/"* Resources/mole/
          cp "$MOLE_ROOT/bin/mole" Resources/mole/
          sed -i '' "s|SCRIPT_DIR=.*|SCRIPT_DIR=\"\$(cd \"\$(dirname \"\${BASH_SOURCE[0]}\")\" \&\& pwd)\"|" Resources/mole/mole
          echo "${{ steps.latest_release.outputs.version }}" > .mole-cli-version

      - name: Compatibility check
        if: steps.check_update.outputs.update_needed == 'true'
        id: compat
        run: |
          ERRORS=""

          # 1. Required files exist
          for f in \
            Resources/mole/mole \
            Resources/mole/bin/status-go \
            Resources/mole/bin/analyze-go \
            Resources/mole/bin/clean.sh \
            Resources/mole/bin/optimize.sh \
            Resources/mole/bin/purge.sh \
            Resources/mole/bin/installer.sh \
            Resources/mole/bin/uninstall.sh; do
            if [ ! -f "$f" ]; then
              ERRORS="$ERRORS\n- Missing file: $f"
            fi
          done

          # 2. Smoke test
          if ! bash Resources/mole/mole version >/dev/null 2>&1; then
            ERRORS="$ERRORS\n- 'mole version' failed to execute"
          fi

          # 3. Subcommand --help check
          for cmd in clean optimize status analyze purge installer uninstall; do
            if ! bash Resources/mole/mole $cmd --help >/dev/null 2>&1; then
              ERRORS="$ERRORS\n- Subcommand '$cmd --help' failed"
            fi
          done

          # 4. status-go JSON schema check (decode with actual Swift Codable structs)
          if [ -x Resources/mole/bin/status-go ]; then
            # Capture one JSON line from status-go (it streams continuously)
            JSON_LINE=$(timeout 5 Resources/mole/bin/status-go 2>/dev/null | head -1 || true)
            if [ -n "$JSON_LINE" ]; then
              # Write a minimal Swift script that imports the project's Codable types
              cat > /tmp/schema_check.swift << 'SWIFT_EOF'
          import Foundation

          // Minimal subset of MetricsSnapshot to validate schema
          struct SchemaCheck: Codable {
              let collectedAt: String
              let host: String
              let platform: String
              let uptime: String
              let healthScore: Int
              let cpu: CPU
              let memory: Mem
              struct CPU: Codable { let usage: Double; let coreCount: Int }
              struct Mem: Codable { let used: UInt64; let total: UInt64; let usedPercent: Double }
          }

          guard let data = CommandLine.arguments.dropFirst().first?.data(using: .utf8) else {
              print("FAIL: no input")
              exit(1)
          }
          do {
              let s = try JSONDecoder().decode(SchemaCheck.self, from: data)
              guard s.cpu.coreCount > 0, s.memory.total > 0 else {
                  print("FAIL: invalid values")
                  exit(1)
              }
              print("OK: schema compatible")
          } catch {
              print("FAIL: \(error)")
              exit(1)
          }
          SWIFT_EOF
              RESULT=$(swift /tmp/schema_check.swift "$JSON_LINE" 2>&1)
              if [ $? -ne 0 ]; then
                ERRORS="$ERRORS\n- status-go JSON schema incompatible: $RESULT"
              fi
            else
              ERRORS="$ERRORS\n- status-go produced no output"
            fi
          fi

          if [ -z "$ERRORS" ]; then
            echo "compatible=true" >> $GITHUB_OUTPUT
          else
            echo "compatible=false" >> $GITHUB_OUTPUT
            echo "errors<<EOF" >> $GITHUB_OUTPUT
            echo -e "$ERRORS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Update MoleUI version
        if: steps.check_update.outputs.update_needed == 'true' && steps.compat.outputs.compatible == 'true'
        run: |
          # Extract version number (remove 'v' prefix if present)
          NEW_VERSION="${{ steps.latest_release.outputs.version }}"
          NEW_VERSION="${NEW_VERSION#v}"

          # Update MARKETING_VERSION in project.pbxproj
          sed -i '' "s/MARKETING_VERSION = [^;]*/MARKETING_VERSION = $NEW_VERSION/" MoleUI.xcodeproj/project.pbxproj

          echo "Updated MoleUI version to $NEW_VERSION"

      - name: Create PR (compatible)
        if: steps.check_update.outputs.update_needed == 'true' && steps.compat.outputs.compatible == 'true'
        id: create_pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update Mole CLI to ${{ steps.latest_release.outputs.version }}"
          branch: auto-update-mole-${{ steps.latest_release.outputs.version }}
          delete-branch: true
          title: "Update Mole CLI to ${{ steps.latest_release.outputs.version }}"
          body: |
            Automated update from **${{ steps.current_version.outputs.version }}** to **${{ steps.latest_release.outputs.version }}**.

            Compatibility check passed:
            - ✅ All required files present
            - ✅ Commands execute successfully
            - ✅ JSON schema compatible
            - ✅ MoleUI version synchronized to ${{ steps.latest_release.outputs.version }}

            Release notes: https://github.com/tw93/Mole/releases/tag/${{ steps.latest_release.outputs.version }}
          labels: dependencies,automated

      - name: Auto-merge PR
        if: steps.check_update.outputs.update_needed == 'true' && steps.compat.outputs.compatible == 'true' && steps.create_pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.create_pr.outputs.pull-request-number }}"

          # Wait for CI checks to complete
          echo "Waiting for CI checks on PR #$PR_NUMBER..."
          gh pr checks "$PR_NUMBER" --watch --interval 30

          # Merge PR
          gh pr merge "$PR_NUMBER" --squash --auto --delete-branch
          echo "PR #$PR_NUMBER merged successfully"

      - name: Create release tag
        if: steps.check_update.outputs.update_needed == 'true' && steps.compat.outputs.compatible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Wait a moment for merge to complete
          sleep 10

          # Pull latest changes
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main

          # Create and push tag
          TAG_VERSION="${{ steps.latest_release.outputs.version }}"
          git tag -a "$TAG_VERSION" -m "Release $TAG_VERSION - Auto-updated Mole CLI"
          git push origin "$TAG_VERSION"

          echo "Created and pushed tag $TAG_VERSION"

      - name: Create Issue (breaking)
        if: steps.check_update.outputs.update_needed == 'true' && steps.compat.outputs.compatible == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Breaking: Mole CLI ${{ steps.latest_release.outputs.version }} has incompatible changes`,
              body: `Mole CLI ${{ steps.latest_release.outputs.version }} failed compatibility checks:\n${{ steps.compat.outputs.errors }}\n\nRelease notes: https://github.com/tw93/Mole/releases/tag/${{ steps.latest_release.outputs.version }}\n\nManual adaptation required.`,
              labels: ['breaking-change', 'mole-update']
            });
